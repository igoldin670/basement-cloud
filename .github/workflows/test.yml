name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python -m py_compile cloud.py tests/integration.py
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen python -u tests/integration.py
